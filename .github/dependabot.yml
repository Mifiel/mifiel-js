# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # TypeScript 7+ and Angular 22+ are not yet a compatible set for this repo
    # (Angular 21/22 require TypeScript <6.1; Angular 22 also needs Node >=22.22.3).
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-devkit/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ng-packagr"
        update-types: ["version-update:semver-major"]
    groups:
      root-deps:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/packages/api-client-auth"
    schedule:
      interval: "weekly"
    # axios@1.19 breaks axios-mock-adapter's AxiosInstance typing
    ignore:
      - dependency-name: "axios"
        versions: [">=1.19.0"]
    groups:
      api-client-auth-deps:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/packages/api-client"
    schedule:
      interval: "weekly"
    # Keep axios in lockstep with api-client-auth (mock-adapter typing break at 1.19)
    ignore:
      - dependency-name: "axios"
        versions: [">=1.19.0"]
    groups:
      api-client-deps:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/packages/models"
    schedule:
      interval: "weekly"
    groups:
      models-deps:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/packages/widget-angular"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-devkit/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ng-packagr"
        update-types: ["version-update:semver-major"]
    groups:
      widget-angular-deps:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/packages/widget-react"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      widget-react-deps:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/packages/widget-stencil"
    schedule:
      interval: "weekly"
    groups:
      widget-stencil-deps:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/packages/widget-vue"
    schedule:
      interval: "weekly"
    groups:
      widget-vue-deps:
        patterns: ["*"]
